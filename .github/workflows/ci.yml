name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend sdk examples
      - run: python backend/test_security.py
      - run: python backend/test_api_security.py
      - run: python backend/test_e2e.py
      - run: python backend/test_task_results.py
      - run: python backend/test_solana_client.py
      - run: python -m unittest discover -s sdk/tests -v
      - run: cp backend/.env.example backend/.env && docker compose config --quiet
      - run: docker build -f backend/Dockerfile.sandbox -t aperture-task:local backend
      - run: python backend/test_worker_security.py
        env:
          APERTURE_TEST_DOCKER: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path programs/Cargo.toml --check
      - run: cargo check --manifest-path programs/Cargo.toml
      - run: cargo test --manifest-path programs/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Install matching Devnet validator tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build deployable SBF program with test-only authority
        run: cargo build-sbf --tools-version v1.57 --manifest-path programs/Cargo.toml --sbf-out-dir target/deploy
        env:
          APERTURE_CONFIG_AUTHORITY: GmaDrppBC7P5ARKV8g3djiwP89vz1jLK23V2GBjuAEGB
      - name: Exercise instructions on a local Solana validator
        run: node frontend/tests/onchain-v2.local-validator.mjs
