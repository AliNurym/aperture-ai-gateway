name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -e "sdk[mcp]"
      - run: python -m compileall -q backend sdk examples
      - run: python -m unittest discover -s backend -p "test*.py"
      - run: python -m unittest discover -s sdk/tests -v
      - run: cp backend/.env.example backend/.env && docker compose config --quiet
      - run: docker build -f backend/Dockerfile.sandbox -t aperture-task:local backend
      - run: python backend/test_worker_security.py
        env:
          APERTURE_TEST_DOCKER: "1"

  workflow-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r backend/requirements.txt -e "sdk[mcp]"
      - run: python scripts/demo_workflow.py --rows 1000 --output .aperture/ci/workflow
      - run: python scripts/demo_workflow.py --rows 17000 --owner-handoff --regional-csv --console-workflow --compare-local --output .aperture/ci/assigned-workflow
      - run: python scripts/check_workflow_cancel.py --output .aperture/ci/cancellation
      - run: python scripts/check_mcp_stdio.py --output .aperture/ci/mcp-stdio
      - run: python scripts/check_mcp_stdio.py --assigned --output .aperture/ci/mcp-assigned
      - run: python scripts/check_workspace_restart.py --output .aperture/ci/workspace-restart
      - run: python scripts/check_exported_plan.py --output .aperture/ci/exported-plan

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run test:protocol --prefix frontend
      - run: npm run test:data --prefix frontend
      - run: npm run test:motion --prefix frontend

  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path programs/Cargo.toml --check
      - run: cargo check --manifest-path programs/Cargo.toml
      - run: cargo test --manifest-path programs/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Install matching Devnet validator tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build deployable SBF program with test-only authority
        run: cargo build-sbf --arch v3 --manifest-path programs/Cargo.toml --sbf-out-dir target/deploy
        env:
          APERTURE_CONFIG_AUTHORITY: GmaDrppBC7P5ARKV8g3djiwP89vz1jLK23V2GBjuAEGB
      - name: Exercise instructions on a local Solana validator
        run: node frontend/tests/onchain-v2.local-validator.mjs
